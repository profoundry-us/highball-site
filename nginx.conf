# Canonical host: 301 www -> apex (Fly terminates TLS and forwards Host)
server {
    listen 8080;
    server_name www.highball.profoundry.us;
    return 301 https://highball.profoundry.us$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Relative Location headers so redirects keep the public scheme/host
    # (we sit behind Fly's TLS-terminating proxy)
    absolute_redirect off;

    # Canonical URLs have no trailing slash: /about/ -> /about
    rewrite ^(.+)/$ $1 permanent;

    # Prerendered pages: /about -> about.html; $uri/ covers the root index.
    # Unknown paths get the prerendered 404 page with a real 404 status.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
